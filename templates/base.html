<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebSentinel Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: #060b17;
            color: #f2f6fb;
        }
        .navbar-brand {
            letter-spacing: 0.04em;
        }
        .nav-link.active {
            font-weight: 700;
            color: #ffffff !important;
        }
        .card {
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .badge-soft {
            color: #fff;
            opacity: .85;
        }
        .table td, .table th {
            vertical-align: middle;
        }
        .filter-pill {
            background: rgba(255, 255, 255, 0.06);
        }
        .chart-card {
            min-height: 320px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary-subtle">
        <div class="container-fluid">
            <a class="navbar-brand" href="/websentinel/">🛡 WebSentinel</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'home' %}active{% endif %}" href="/websentinel/">Overview</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'live-monitor' %}active{% endif %}" href="/websentinel/live-monitor">Live</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'incidents' %}active{% endif %}" href="/websentinel/incidents">Incidents</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'analytics' %}active{% endif %}" href="/websentinel/analytics">Analytics</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-secondary py-3 border-top border-secondary-subtle">
        <small>WebSentinel Proxy Dashboard · Monitoring traffic and incident data in real time.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
