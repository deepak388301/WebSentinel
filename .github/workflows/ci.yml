name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: websentinel
          POSTGRES_PASSWORD: websentinel
          POSTGRES_DB: websentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U websentinel"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations against Postgres
        env:
          FLASK_APP: proxy_app.py
          WEBSENTINEL_DB_URI: postgresql+psycopg://websentinel:websentinel@localhost:5432/websentinel_test
          # The app refuses to start without an admin password (fail-fast).
          WEBSENTINEL_ADMIN_PASS: ci-test
        run: flask db upgrade

      - name: Run tests
        env:
          WEBSENTINEL_DB_URI: postgresql+psycopg://websentinel:websentinel@localhost:5432/websentinel_test
        run: pytest -v
